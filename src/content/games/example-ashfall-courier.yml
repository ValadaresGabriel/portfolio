  codeSnippet: |
    void Tick()
    {
        // Spread to a budget of cells per frame to avoid spikes.
        for (int i = 0; i < cellsPerFrame && frontier.Count > 0; i++)
        {
            var cell = frontier.Dequeue();
            foreach (var n in grid.Neighbours(cell))
                if (grid.TryIgnite(n)) frontier.Enqueue(n);
        }
    }
